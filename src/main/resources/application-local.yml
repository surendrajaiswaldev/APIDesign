spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/APIServiceMONO}
    username: ${DB_USERNAME:system}
    password: ${DB_PASSWORD:NewPassword}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate validates the entity model against it on boot,
      # so any drift (forgotten column, wrong type) fails fast instead of silently
      # rewriting tables. If you switched from ddl-auto for the first time, drop the
      # existing tables once (see README) so V1 can run cleanly.
      ddl-auto: validate
      format_sql: true
    show-sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.apidesign: DEBUG
    org.hibernate.SQL: DEBUG
    # Only enabled locally: prints actual JDBC bind parameter values.
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    # Flyway boot diagnostics: shows DB detection, migration discovery,
    # validation, applied versions, and any silently-skipped migrations.
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.boot.autoconfigure.orm.jpa: DEBUG

# Local-profile feature flags: easier developer ergonomics.
# Auth is OFF (all endpoints public) and bean validation is OFF (@Valid is a no-op).
# Both flags default to true elsewhere; flip if you want to test the production paths.
app:
  security:
    jwt:
      enabled: false
  validation:
    enabled: false
  audit:
    exceptions:
      # Local devs want DB-logged exceptions while iterating.
      enabled: true
