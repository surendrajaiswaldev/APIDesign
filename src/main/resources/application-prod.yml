spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 60000
      idle-timeout: 900000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
      format_sql: false
    show-sql: false

logging:
  level:
    root: WARN
    com.apidesign: INFO
  file:
    name: /var/log/order-management-system/application.log

springdoc:
  swagger-ui:
    enabled: false

server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12

app:
  security:
    jwt:
      enabled: true
  validation:
    enabled: true
