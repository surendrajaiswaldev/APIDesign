spring:
  application:
    name: order-management-system

  threads:
    virtual:
      enabled: true

  flyway:
    enabled: true
    # The migrations are idempotent (each CREATE wrapped in PL/SQL that swallows
    # ORA-00955 "name already used"), so baseline-on-migrate=true is safe: even
    # if Flyway baselines an existing schema and "skips" V1, the next deployment
    # of a new V_n migration will still find the tables it needs because V1's
    # CREATE statements would silently no-op anyway. Belt-and-suspenders.
    baseline-on-migrate: true
    # Dedicated schema for this service. Flyway creates the schema if missing
    # (provided the connecting user has CREATE USER / CREATE SCHEMA privileges)
    # and sets CURRENT_SCHEMA for the session before running migrations.
    schemas: apiservice
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      # Flyway owns schema; Hibernate just verifies entities match.
      ddl-auto: validate
      format_sql: true
      use_sql_comments: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        # Match Flyway's schemas setting so Hibernate validates against the
        # same place Flyway created tables in.
        default_schema: apiservice
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        enable_lazy_load_no_trans: false
      # JPA standard query timeout (ms). Caps every JPA query — including criteria,
      # @Query, findAll, etc. — at 5 s by default. Individual queries can still
      # override per-call via QueryHints. Surfaces as PersistenceException →
      # mapped to 500 by GlobalExceptionHandler.
      jakarta.persistence.query.timeout: 5000
    show-sql: false
    open-in-view: false

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
      connection-test-query: "SELECT 1 FROM DUAL"

logging:
  level:
    root: INFO
    com.apidesign: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%X{traceId:-}/%X{spanId:-}] %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-}] [%X{traceId:-}/%X{spanId:-}] %logger{36} - %msg%n"

server:
  servlet:
    context-path: /api/v1
  port: 8080
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

app:
  security:
    jwt:
      # When false, the JWT filter is not added and all endpoints permitAll.
      enabled: true
      # JWT HMAC signing secret. MUST be overridden in non-local profiles.
      # Minimum 32 bytes for HS256.
      secret: ${JWT_SECRET:change-me-local-dev-secret-please-override-in-prod-32b}
      expiry-minutes: 60
      # Refresh tokens live longer than access tokens; rotation revokes on each use.
      refresh-expiry-days: 7
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      allowed-headers: "*"
  rate-limit:
    enabled: true
    default-requests-per-minute: 60
    default-burst: 10
    authenticated-multiplier: 5.0
    endpoints: {}
  validation:
    # When false, @Valid / @Validated become no-ops everywhere.
    enabled: true
  audit:
    exceptions:
      # When false, no rows are written to APPLICATION_EXCEPTION (request log lines remain).
      enabled: true
  idempotency:
    # When true (default), the IdempotencyKeyFilter intercepts POST / PATCH requests that
    # carry an Idempotency-Key header. The first 2xx response is cached in the
    # IDEMPOTENCY_KEY table; subsequent requests with the same key replay the cached body
    # and set Idempotent-Replay: true. Mismatched bodies for the same key return 422.
    # When false the filter passes everything through unchanged.
    enabled: true

# Resilience4j: declarative circuit breaker / retry / bulkhead for PaymentService.
# Auto-bound by the Spring Boot 3 starter — no Java config needed.
resilience4j:
  circuitbreaker:
    instances:
      payment:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      payment:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
  bulkhead:
    instances:
      payment:
        max-concurrent-calls: 10
