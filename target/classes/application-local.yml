spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: system
    password: password

  jpa:
    hibernate:
      # IMPORTANT: Change to 'validate' when schema is stable to prevent data loss
      # Current 'create-drop' recreates schema on each startup (clean for initial local dev)
      # Once data persistence is needed, switch to 'update' or 'validate' + Flyway migrations
      ddl-auto: create-drop
      format_sql: true
    show-sql: true # Show SQL in console for debugging

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.apidesign: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG

