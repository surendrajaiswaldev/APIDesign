spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:oracle:thin:@dev-oracle-host:1521/FREEPDB1
    username: ${DB_USERNAME:system}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate  # Only validate schema in dev environment
    show-sql: false

logging:
  level:
    root: INFO
    com.apidesign: INFO
    org.hibernate.SQL: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

